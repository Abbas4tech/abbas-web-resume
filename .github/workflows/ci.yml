name: CI

on:
  push:
    branches:
      - 'develop-draft'
      - '**/develop-draft/**'
      - 'feat/develop-draft/**'
  pull_request:
    branches:
      - master
      - 'develop-draft'
      - '**/develop-draft/**'
      - 'feat/develop-draft/**'

# Supersede a run in progress for the same branch/PR when new commits land,
# instead of letting both burn runner minutes to completion. See ADR 0023.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SHARD_TOTAL: 4

jobs:
  check-changeset:
    name: Check Changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff to compare against origin/<base>
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Changeset
        run: python scripts/ci/check-changeset.py

  # lint / typecheck / unit-test / e2e-test / build / build-storybook all only
  # need check-changeset, not each other — they used to run as sequential
  # steps in one job (~25-48 min end to end). Running them as sibling jobs
  # lets GitHub Actions schedule them concurrently on separate runners, so
  # total wall time drops to roughly the slowest single job instead of the
  # sum of all of them. See ADR 0023.

  lint:
    name: Lint & Format
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Linting & Formatting
        run: pnpm check

  typecheck:
    name: Typecheck
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm tsc --noEmit

  unit-test:
    name: Unit & Component Tests
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit & Component Tests
        run: pnpm test:coverage
      - name: Upload Unit Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14

  e2e-test:
    name: E2E Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Deliberately not cached: Playwright's own CI guide notes restoring a
      # browser-binary cache takes about as long as downloading fresh, so a
      # cache step here is pure overhead, not a speedup.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # Splits the suite across 4 parallel jobs instead of running all 6
      # device projects serially in one — this is what actually cut the
      # ~48-minute CI run down, not the worker count within a single job
      # (Playwright's own CI guidance is workers: 1 in-job, and to get
      # parallelism from sharding across machines instead). See ADR 0023.
      - name: Run E2E Tests (shard ${{ matrix.shardIndex }})
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ env.PLAYWRIGHT_SHARD_TOTAL }}
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
          # MSW intercepts the GraphQL request by operation name, not by
          # URL or credentials, so these never need to be real -- but they
          # DO need to exist: src/contentful/lib/client.ts builds the
          # GraphQL endpoint via string interpolation
          # (`${BASE_URL}/${SPACE_ID}/environments/${ENVIRONMENT}`), and
          # with these unset that interpolates to the literal string
          # "undefined/undefined/environments/undefined". The Fetch API's
          # Request constructor throws `TypeError: Invalid URL` on that
          # before MSW ever gets a chance to intercept it -- confirmed by
          # reproducing this exact crash locally and in a real CI run
          # after these were first dropped from this job. Placeholders
          # only; never put real Contentful secrets here (see `build`,
          # the one job that actually talks to real Contentful).
          CONTENTFUL_API_BASE_URL: https://cdn.contentful.mock
          CONTENTFUL_SPACE_ID: mock-space-id
          CONTENTFUL_ENVIRONMENT: mock
          CONTENTFUL_CDA_TOKEN: mock-token
      - name: Upload Blob Report (shard ${{ matrix.shardIndex }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 14

  merge-e2e-reports:
    name: Merge E2E Reports
    if: ${{ !cancelled() }}
    needs: e2e-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build Project
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only this job talks to real Contentful (`next build` statically
      # renders pages from it). `e2e-test` runs against the MSW-mocked
      # fixture site instead (tests/mocks/handlers.ts matches by GraphQL
      # operation name, not URL/credentials) but still needs *some* syntactically
      # valid values here, just not real ones — see the placeholder env block
      # on that job for why. lint/typecheck/unit-test never construct this
      # endpoint at all, so they need nothing.
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_CDA_TOKEN: ${{ secrets.CONTENTFUL_CDA_TOKEN }}
      CONTENTFUL_API_BASE_URL: ${{ secrets.CONTENTFUL_API_BASE_URL }}
      CONTENTFUL_ENVIRONMENT: ${{ github.base_ref == 'master' && 'production' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Build Project
        run: pnpm build

  build-storybook:
    name: Build Storybook
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Upload Storybook Static Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 14

  storybook-a11y:
    name: Storybook Accessibility Tests
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Only chromium: the test-runner's own preVisit/postVisit hooks
      # (.storybook/test-runner.ts) run axe against one engine by design —
      # this isn't a cross-browser visual check, unlike e2e-test's matrix.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # Builds Storybook, serves the static output, waits for it to be
      # reachable, then runs the test-runner (axe a11y checks) against every
      # story. Previously this repo only ran `build-storybook` in CI — a
      # bundling check that cannot catch a story failing to render at all
      # (e.g. a missing Storybook context provider) or an accessibility
      # regression, since neither requires the story to actually mount in a
      # browser. See docs/06-storybook.md.
      - name: Run Storybook accessibility tests
        run: pnpm test-storybook:ci
