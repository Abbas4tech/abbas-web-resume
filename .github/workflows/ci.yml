name: CI

on:
  push:
    branches:
      - 'develop-draft'
      - '**/develop-draft/**'
      - 'feat/develop-draft/**'
  pull_request:
    branches:
      - master
      - 'develop-draft'
      - '**/develop-draft/**'
      - 'feat/develop-draft/**'

# Supersede a run in progress for the same branch/PR when new commits land,
# instead of letting both burn runner minutes to completion. See ADR 0023.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SHARD_TOTAL: 4

jobs:
  check-changeset:
    name: Check Changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff to compare against origin/<base>
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Changeset
        run: python scripts/ci/check-changeset.py

  # lint / typecheck / unit-test / e2e-test / build / build-storybook all only
  # need check-changeset, not each other — they used to run as sequential
  # steps in one job (~25-48 min end to end). Running them as sibling jobs
  # lets GitHub Actions schedule them concurrently on separate runners, so
  # total wall time drops to roughly the slowest single job instead of the
  # sum of all of them. See ADR 0023.

  lint:
    name: Lint & Format
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Linting & Formatting
        run: pnpm check

  typecheck:
    name: Typecheck
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm tsc --noEmit

  unit-test:
    name: Unit & Component Tests
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit & Component Tests
        run: pnpm test:coverage
      - name: Upload Unit Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14

  e2e-test:
    name: E2E Tests (${{ matrix.shardIndex }}/${{ strategy.job-total }})
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Deliberately not cached: Playwright's own CI guide notes restoring a
      # browser-binary cache takes about as long as downloading fresh, so a
      # cache step here is pure overhead, not a speedup.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # Splits the suite across 4 parallel jobs instead of running all 6
      # device projects serially in one — this is what actually cut the
      # ~48-minute CI run down, not the worker count within a single job
      # (Playwright's own CI guidance is workers: 1 in-job, and to get
      # parallelism from sharding across machines instead). See ADR 0023.
      - name: Run E2E Tests (shard ${{ matrix.shardIndex }})
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ env.PLAYWRIGHT_SHARD_TOTAL }}
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
          # MSW intercepts the GraphQL request by operation name, not by
          # URL or credentials, so these never need to be real -- but they
          # DO need to exist: src/contentful/lib/client.ts builds the
          # GraphQL endpoint via string interpolation
          # (`${BASE_URL}/${SPACE_ID}/environments/${ENVIRONMENT}`), and
          # with these unset that interpolates to the literal string
          # "undefined/undefined/environments/undefined". The Fetch API's
          # Request constructor throws `TypeError: Invalid URL` on that
          # before MSW ever gets a chance to intercept it -- confirmed by
          # reproducing this exact crash locally and in a real CI run
          # after these were first dropped from this job. Placeholders
          # only; never put real Contentful secrets here (see `build`,
          # the one job that actually talks to real Contentful).
          CONTENTFUL_API_BASE_URL: https://cdn.contentful.mock
          CONTENTFUL_SPACE_ID: mock-space-id
          CONTENTFUL_ENVIRONMENT: mock
          CONTENTFUL_CDA_TOKEN: mock-token
      - name: Upload Blob Report (shard ${{ matrix.shardIndex }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 14

  merge-e2e-reports:
    name: Merge E2E Reports
    if: ${{ !cancelled() }}
    needs: e2e-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build Project
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # These need to be *syntactically* valid (see `e2e-test`'s placeholder
      # block for why), but do NOT actually need to be real, and this job's
      # `CONTENTFUL_ENVIRONMENT` choice has no effect on what gets verified:
      # the catch-all route (src/app/(app)/[[...slug]]/page.tsx) has no
      # `generateStaticParams`, so it's fully dynamic and `next build` never
      # calls its Contentful queries at all. A green build here only proves
      # the code compiles — it proves nothing about whether a given
      # environment's live schema still matches what the code queries.
      # That's what the `verify-contentful-schema` job below is for.
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_CDA_TOKEN: ${{ secrets.CONTENTFUL_CDA_TOKEN }}
      CONTENTFUL_API_BASE_URL: ${{ secrets.CONTENTFUL_API_BASE_URL }}
      CONTENTFUL_ENVIRONMENT: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - name: Build Project
        run: pnpm build

  # Actually exercises the app's real GraphQL queries (GetLayout,
  # GetPageByPath for every real page) against both live Contentful
  # environments, using the same generated SDK the deployed app calls at
  # request time. Added after a real incident: `pnpm contentful:setup`
  # schema pushes had only ever targeted `development`, so `production`
  # silently drifted out of sync (a field present on one environment's
  # content type but not the other) — invisible to `build` (never calls
  # these queries — see its env block above) and to unit/E2E tests (MSW
  # mocks always match the adapters, regardless of a real environment's
  # actual schema). This is the only job that would have caught it before
  # merge instead of in production. Runs unconditionally against both
  # environments, regardless of which branch the PR targets, so drift in
  # either direction fails CI immediately.
  verify-contentful-schema:
    name: Verify Contentful Schema (${{ matrix.environment }})
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [development, production]
    env:
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_CDA_TOKEN: ${{ secrets.CONTENTFUL_CDA_TOKEN }}
      CONTENTFUL_API_BASE_URL: ${{ secrets.CONTENTFUL_API_BASE_URL }}
      CONTENTFUL_ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Pure Python, stdlib only — reads the already-checked-out generated
      # SDK file directly and talks to Contentful over plain HTTP, so this
      # job needs no pnpm/Node install at all.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Contentful Schema
        run: python scripts/contentful/verify-contentful-schema.py

  build-storybook:
    name: Build Storybook
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Upload Storybook Static Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 14

  storybook-a11y:
    name: Storybook Accessibility Tests
    needs: check-changeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Only chromium: the test-runner's own preVisit/postVisit hooks
      # (.storybook/test-runner.ts) run axe against one engine by design —
      # this isn't a cross-browser visual check, unlike e2e-test's matrix.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # Builds Storybook, serves the static output, waits for it to be
      # reachable, then runs the test-runner (axe a11y checks) against every
      # story. Previously this repo only ran `build-storybook` in CI — a
      # bundling check that cannot catch a story failing to render at all
      # (e.g. a missing Storybook context provider) or an accessibility
      # regression, since neither requires the story to actually mount in a
      # browser. See docs/06-storybook.md.
      - name: Run Storybook accessibility tests
        run: pnpm test-storybook:ci
