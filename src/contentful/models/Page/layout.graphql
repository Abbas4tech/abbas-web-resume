fragment LayoutFields on Layout {
  sys {
    id
  }
  internalName
  title
  role
  resume {
    url
    title
  }
  globalSeo {
    ...SeoMetadataFields
  }
  defaultTheme
  themeList
  logo {
    url
    title
    description
    width
    height
  }
  email
  footerText
  resumeIcon {
    ...IconFields
  }
  themeIcon {
    ...IconFields
  }
  drawerVariant
  drawerSide
  navigation {
    ...ContentListFields
  }
}
